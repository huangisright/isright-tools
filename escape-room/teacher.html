<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密室逃脫 — 教師監看台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128200;</text></svg>">
<style>
:root{
  --bg:#0b131a; --panel:#11202b; --deep:#060c11;
  --text:#e0f2fe; --muted:#7da3b5; --accent:#f59e0b;
  --green:#059669; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
     font-family:'Courier New',Courier,monospace;padding:16px}
h1{font-size:1.2rem;color:var(--accent);margin:0 0 4px}
.sub{font-size:.8rem;color:var(--muted);margin:0 0 16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
input,button,select{font-family:inherit;font-size:.95rem;border-radius:4px}
input,select{background:var(--deep);border:1px solid var(--green);color:var(--text);padding:10px}
button{min-height:40px;padding:10px 16px;border:none;background:var(--green);color:#fff;
       font-weight:bold;cursor:pointer}
button:hover:not(:disabled){background:#047857}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;border:1px solid var(--accent);color:var(--accent);
             padding:6px 10px;min-height:32px;font-size:.8rem}
.msg{padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:.9rem}
.msg.err{background:rgba(239,68,68,.12);border:1px solid var(--bad);color:#fecaca}
.msg.ok{background:rgba(16,185,129,.12);border:1px solid var(--ok);color:#d1fae5}
.wrap{overflow-x:auto;border:1px solid var(--green);border-radius:8px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.07);white-space:nowrap}
th{background:var(--deep);color:var(--muted);font-size:.78rem;letter-spacing:1px}
tr:last-child td{border-bottom:none}
.t{font-variant-numeric:tabular-nums;font-weight:bold}
.t.ok{color:var(--ok)} .t.warn{color:var(--warn)} .t.bad{color:var(--bad)}
.pill{font-size:.75rem;padding:2px 10px;border-radius:999px;border:1px solid currentColor}
.pill.run{color:var(--ok)} .pill.wait{color:var(--muted)}
.pill.late{color:var(--bad)} .pill.done{color:var(--accent)}
.prog{color:var(--accent);font-weight:bold}
.foot{font-size:.75rem;color:var(--muted);margin-top:12px;line-height:1.7}
.hidden{display:none!important}
</style>
</head>
<body>

<h1>教師監看台</h1>
<p class="sub">失落黃金城 · 各組即時進度</p>

<div id="login" class="bar">
  <input type="password" id="key" placeholder="監看密碼" autocomplete="off" aria-label="監看密碼">
  <button id="login-btn">連線</button>
</div>

<div id="msg" class="msg hidden" role="status" aria-live="polite"></div>

<div id="panel" class="hidden">
  <div class="bar">
    <span class="sub" id="updated">—</span>
    <button id="refresh-btn" class="ghost">立即更新</button>
    <button id="logout-btn" class="ghost">登出</button>
  </div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th>組別</th><th>進度</th><th>關卡</th><th>狀態</th>
        <th>剩餘時間</th><th>提示</th><th>答錯</th><th>逾時</th><th>加時</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot">
    每 10 秒自動更新。剩餘時間由後端起算，學生重新整理或換裝置都不會重新計時。<br>
    「加時」會把該組本關的時限往後延；若該組已逾時，加時同時會把他們解鎖回「進行中」。
  </p>
</div>

<script>
// 與 script.js 相同的 Web App 網址
const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwu3to7eyY3AzHoA1Qx_zuRDEUMdHzWMfqaxk6Uk3N501H35YMjwLIfW72mNs6pE39l/exec";
const POLL_MS = 10000;
const KEY_STORE = 'escape_room_teacher_key';

let KEY = null, teams = [], polledAt = 0, pollId = null, tickId = null;

const el = function (id) { return document.getElementById(id); };

function msg(text, kind) {
  const m = el('msg');
  m.textContent = text;
  m.className = 'msg ' + (kind || '');
  m.classList.toggle('hidden', !text);
}

async function api(params) {
  const url = GAS_API_URL + '?' + new URLSearchParams(params).toString();
  const res = await fetch(url, { cache: 'no-store', redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function fmt(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function statusPill(status) {
  const span = document.createElement('span');
  span.className = 'pill ' + (
    status === '進行中' ? 'run' :
    status === '待開始' ? 'wait' :
    status === '全部完成' ? 'done' : 'late');
  span.textContent = status || '—';
  return span;
}

function cell(row, text, cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  td.textContent = text;
  row.appendChild(td);
  return td;
}

function render() {
  const body = el('rows');
  body.textContent = '';

  if (!teams.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 9;
    td.textContent = '還沒有任何一組登入。';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  const sorted = teams.slice().sort(function (a, b) {
    return (b.levelIndex - a.levelIndex) || a.team.localeCompare(b.team);
  });

  sorted.forEach(function (t) {
    const tr = document.createElement('tr');
    cell(tr, t.name ? (t.name + '（' + t.team + '）') : t.team);
    cell(tr, t.levelIndex + ' / ' + t.levelTotal, 'prog');
    cell(tr, t.level + (t.author ? '（' + t.author + '）' : ''));

    const st = document.createElement('td');
    st.appendChild(statusPill(t.status));
    tr.appendChild(st);

    // 剩餘時間：用上次輪詢的值扣掉本地經過時間，畫面才會逐秒跑
    const live = (t.status === '進行中')
      ? Math.max(0, t.remainingMs - (Date.now() - polledAt))
      : t.remainingMs;
    const klass = t.status !== '進行中' ? 't'
      : (live <= 120000 ? 't bad' : (live <= 300000 ? 't warn' : 't ok'));
    cell(tr, (t.status === '全部完成' ? '—' : fmt(live)), klass);

    cell(tr, String(t.hintCount));
    cell(tr, String(t.wrongCount));
    cell(tr, String(t.timeoutCount));

    const act = document.createElement('td');
    [3, 5].forEach(function (m) {
      const b = document.createElement('button');
      b.className = 'ghost';
      b.textContent = '+' + m + '分';
      b.style.marginRight = '6px';
      b.disabled = (t.status === '全部完成');
      b.addEventListener('click', function () { extend(t.team, m, b); });
      act.appendChild(b);
    });
    tr.appendChild(act);

    body.appendChild(tr);
  });
}

async function extend(team, minutes, btn) {
  btn.disabled = true;
  try {
    const r = await api({ action: 'extend', key: KEY, team: team, minutes: minutes });
    if (r.success) { msg(team + ' 已加時 ' + minutes + ' 分鐘。', 'ok'); await poll(); }
    else msg(r.message, 'err');
  } catch (e) {
    msg('加時失敗：連線錯誤。', 'err');
  } finally {
    btn.disabled = false;
  }
}

async function poll() {
  try {
    const r = await api({ action: 'dashboard', key: KEY });
    if (!r.success) {
      msg(r.message, 'err');
      if (r.code === 'bad_key') logout();
      return;
    }
    teams = r.data.teams || [];
    polledAt = Date.now();
    el('updated').textContent = '最後更新 ' + new Date().toLocaleTimeString('zh-TW') +
      '　逾時政策：' + (r.data.policy === 'continue' ? '逾時可繼續下一關' : '逾時即結束');
    msg('', '');
    render();
  } catch (e) {
    msg('連線失敗，10 秒後自動重試。', 'err');
  }
}

function startPolling() {
  el('login').classList.add('hidden');
  el('panel').classList.remove('hidden');
  poll();
  pollId = setInterval(poll, POLL_MS);
  tickId = setInterval(render, 1000);
}

function logout() {
  KEY = null;
  try { sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 忽略 */ }
  if (pollId) clearInterval(pollId);
  if (tickId) clearInterval(tickId);
  el('panel').classList.add('hidden');
  el('login').classList.remove('hidden');
}

el('login-btn').addEventListener('click', function () {
  const k = el('key').value.trim();
  if (!k) { msg('請輸入監看密碼。', 'err'); return; }
  KEY = k;
  try { sessionStorage.setItem(KEY_STORE, k); } catch (e) { /* 忽略 */ }
  startPolling();
});
el('key').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') el('login-btn').click();
});
el('refresh-btn').addEventListener('click', poll);
el('logout-btn').addEventListener('click', logout);

(function () {
  let saved = null;
  try { saved = sessionStorage.getItem(KEY_STORE); } catch (e) { /* 忽略 */ }
  if (saved) { KEY = saved; startPolling(); }
  else el('key').focus();
})();
</script>
</body>
</html>
